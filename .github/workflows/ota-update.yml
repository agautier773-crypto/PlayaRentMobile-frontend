name: OTA Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Message de la mise à jour"
        required: true
        default: "Mise à jour"

jobs:
  update:
    name: Publier update OTA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publier l'update sur le canal production
        run: eas update --channel production --message "${{ github.event.inputs.message }}"